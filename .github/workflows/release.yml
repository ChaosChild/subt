name: Release

# A tag is the entire release ritual: the CI triple runs, then publish with
# provenance (trusted publishing / OIDC – no npm token exists), then the
# GitHub Release. Configure the trusted publisher on the npm package before
# the first tagged release (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance via trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test
      - run: npm publish --provenance
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
